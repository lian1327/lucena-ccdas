      - division_id
      - endorsements
      - escalation_level_display
      - evidence
      - inspected_by
      - level_display
      - max_extension_due
      - priority_level
      - reports
      - responded_by
      - screening_checklist
      - stage
      - validated_by
      - work_completed_by
    CaseInfoLevelEnum:
      enum:
      - city
      - barangay
      - external

      parameters:
      - in: query
        name: barangay
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: include_duplicates
        schema:
          type: boolean
      - in: query
        name: q
        schema:
          type: string
        description: Search reference no., title, landmark, description
      - in: query
        name: tab
        schema:
          type: string
          enum:
          - all

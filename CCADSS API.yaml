        * `barangay` - Barangay-level
        * `external` - Endorsed to external agency
    CitizenConfirmationEnum:
      enum:
      - fixed
      - not_fixed
      type: string
      description: |-
        * `` - Not asked / no answer
        * `fixed` - Citizen confirmed it is fixed
        * `not_fixed` - Citizen says it is NOT fixed
    CompleteRequest:
      type: object
      description: Accomplishment report + before/after photos.
      properties:
        remarks:
          type: string
          minLength: 1
          description: Work done (shown to the citizen once validated).
          maxLength: 1000
        photos:
          type: array
          items:
            type: string
            format: binary
          description: AFTER photos.
          maxItems: 3
        photo_meta:
          description: 'JSON list aligned with the photos: [{exif_lat, exif_lng, exif_time,
            device_lat, ...}]'
        before_photos:
          type: array
          items:
            type: string
            format: binary
          maxItems: 3
        before_meta:
          description: 'JSON list aligned with the photos: [{exif_lat, exif_lng, exif_time,
            device_lat, ...}]'
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        crew:
          description: JSON list of user ids.
        other_workers:
          type: string
          maxLength: 300
        materials:
          description: 'JSON list: [{"item": "Cold mix", "qty": 4, "unit": "sacks"}]'
        equipment:
          type: string
          maxLength: 300
      required:
      - remarks
    ConcernChannelEnum:

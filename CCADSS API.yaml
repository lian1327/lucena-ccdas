  /api/v1/public/concerns/:
    post:
      operationId: v1_public_concerns_create
      description: Citizen submission. Accepts multipart/form-data (with `images`)
        or JSON (without).
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicConcernCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicConcernCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicConcernCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConcernCreate'
          description: ''
  /api/v1/public/concerns/track/{reference_no}/:

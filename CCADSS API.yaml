      - facebook
      - messenger
      - walk_in
      - barangay
      - hotline
      - '8888'
      type: string
      description: |-
        * `web` - Web Portal
        * `facebook` - Facebook Comment
        * `messenger` - Messenger
        * `walk_in` - Walk-in
        * `barangay` - Barangay Report
        * `hotline` - Hotline / Call
        * `8888` - 8888 Citizens' Complaint Center
    ConcernStatusEnum:
      enum:
      - submitted
      - under_review
      - assigned
      - in_progress
      - resolved
      - closed
      - rejected
      type: string
      description: |-
        * `submitted` - Submitted
        * `under_review` - Under Review
        * `assigned` - Assigned
        * `in_progress` - In Progress
        * `resolved` - Resolved
        * `closed` - Closed
        * `rejected` - Rejected
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string

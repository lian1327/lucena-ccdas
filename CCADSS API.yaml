  /api/v1/staff/concerns/:
    get:
      operationId: v1_staff_concerns_list
      description: Staff case inbox and workflow. Visibility and every action are
        decided in scoping.py.
      parameters:
      - in: query
        name: barangay
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: include_duplicates
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search reference no., title, landmark, description
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tab
        schema:
          type: string
          enum:
          - all
          - closed
          - endorsed
          - for_acceptance
          - mine
          - open
          - overdue
          - to_route
          - triage
          - validation
        description: 'Inbox view (default: open)'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffConcernListList'
          description: ''

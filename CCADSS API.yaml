          description: ''
  /api/v1/public/concerns/track/{reference_no}/confirm/:
    post:
      operationId: v1_public_concerns_track_confirm_create
      description: |-
        "Naayos ba talaga?" — the reporter confirms or disputes the fix (within 30 days, once).
        Not fixed → the case reopens for the office and counts against it. Throttled like submissions.
      parameters:
      - in: path
        name: reference_no
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrack'
          description: ''
  /api/v1/public/stats/:
    get:
      operationId: v1_public_stats_retrieve
      description: Transparency stats for the landing page. Aggregates only — no individual
        records. Cached 5 min.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStats'

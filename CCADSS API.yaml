  /api/v1/staff/analytics/accountability/:
    get:
      operationId: analytics_accountability
      description: Proof-of-work quality per office + the supervisor watchlist.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD (period=custom)
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD (period=custom)
      - in: query
        name: period
        schema:
          type: string
          enum:
          - 12m
          - 90d
          - custom
          - last_month
          - quarter
          - this_month
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accountability'
          description: ''

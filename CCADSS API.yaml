components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        priority_level:
          type: integer
        priority_reason:
          type: string
          maxLength: 300
        screening:
          type: object
          additionalProperties:
            type: boolean
        division:
          type: integer
          nullable: true
        remarks:
          type: string
          maxLength: 500
      required:
      - priority_level
    AccomplishmentReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/AccomplishmentReportStatusEnum'
        status_display:
          type: string
        submitted_by:
          type: string
          nullable: true
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        work_done:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        crew:
          type: array
          items:
            type: string
          readOnly: true
        other_workers:
          type: string
          description: Job-order / barangay workers without accounts.
          maxLength: 300
        headcount:
          type: integer
        man_hours:
          type: number
          format: double
          nullable: true
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        equipment:
          type: string
          maxLength: 300
        reviewed_by:
          type: string
          nullable: true
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_remarks:
          type: string
        override_reason:
          type: string
          description: Why the validator approved even though the photo checks raised
            a red flag.
      required:
      - crew
      - headcount
      - id
      - man_hours
      - materials
      - reviewed_by
      - status_display
      - submitted_at
      - submitted_by
      - work_done
    AccomplishmentReportStatusEnum:
      enum:
      - submitted
      - approved
      - returned
      type: string
      description: |-
        * `submitted` - Submitted, awaiting validation
        * `approved` - Approved
        * `returned` - Returned to the field
    Accountability:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeProofRow'
        watchlist:
          type: array
          items:
            $ref: '#/components/schemas/WatchItem'
        proof_target:
          type: number
          format: double
      required:
      - offices
      - period
      - proof_target
      - watchlist
    AffectedScaleEnum:
      enum:
      - self
      - household
      - street
      - barangay
      type: string
      description: |-
        * `self` - self
        * `household` - household
        * `street` - street
        * `barangay` - barangay
    Aging:
      type: object
      properties:
        bucket:
          type: string
        count:
          type: integer
      required:
      - bucket
      - count
    AssignDivisionRequest:
      type: object
      properties:
        division:
          type: integer
        remarks:
          type: string
          maxLength: 500
      required:
      - division
    AssignPersonRequest:
      type: object
      properties:
        person:
          type: integer
        remarks:
          type: string
          maxLength: 500
      required:
      - person
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AttachmentKindEnum'
        url:
          type: string
          readOnly: true
        caption:
          type: string
          maxLength: 150
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        uploaded_by:
          type: string
          nullable: true
          readOnly: true
        report_id:
          type: integer
          nullable: true
          description: The accomplishment report this before/after photo was submitted
            with.
          readOnly: true
        taken_at:
          type: string
          format: date-time
          nullable: true
        time_source:
          $ref: '#/components/schemas/TimeSourceEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        gps_source:
          $ref: '#/components/schemas/GpsSourceEnum'
        gps_accuracy_m:
          type: number
          format: double
          nullable: true
        distance_m:
          type: number
          format: double
          nullable: true
          description: Distance from the reported location.
        flags:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceFlag'
          readOnly: true
      required:
      - flags
      - id
      - report_id
      - uploaded_at
      - uploaded_by
      - url
    AttachmentKindEnum:
      enum:
      - report
      - before
      - progress
      - resolution
      type: string
      description: |-
        * `report` - Report photo (from reporter)
        * `before` - Before photo (staff, at the site before work)
        * `progress` - Progress / make-safe photo (staff, internal)
        * `resolution` - After photo (proof of fix)
    BarangayStat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        population:
          type: integer
        concerns:
          type: integer
        reports:
          type: integer
        open:
          type: integer
        overdue:
          type: integer
        per_10k:
          type: number
          format: double
          nullable: true
        median_days_to_resolve:
          type: number
          format: double
          nullable: true
        top_issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueCount'
      required:
      - concerns
      - id
      - lat
      - lng
      - median_days_to_resolve
      - name
      - open
      - overdue
      - per_10k
      - population
      - reports
      - top_issues
    BlankEnum:
      enum:
      - ''
    CCADSSTokenObtainPairRequest:
      type: object
      description: Adds role/scope claims so the frontend can route without an extra
        request.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    CaseInfo:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/CaseInfoLevelEnum'
        level_display:
          type: string
        stage:
          type: string
        department_id:
          type: integer
          nullable: true
          description: Empty for barangay-level cases.
          readOnly: true
        department:
          type: string
        division_id:
          type: integer
          nullable: true
          readOnly: true
        division:
          type: string
        assigned_to_id:
          type: integer
          nullable: true
          readOnly: true
        assigned_to:
          type: string
          nullable: true
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
        due_at:
          type: string
          format: date-time
          nullable: true
        original_due_at:
          type: string
          format: date-time
          nullable: true
        extended_at:
          type: string
          format: date-time
          nullable: true
        extension_reason:
          type: string
        max_extension_due:
          type: string
          nullable: true
          readOnly: true
        inspected_at:
          type: string
          format: date-time
          nullable: true
        inspected_by:
          type: string
          nullable: true
          readOnly: true
        inspection_findings:
          type: string
        action_plan:
          type: string
        scheduled_for:
          type: string
          format: date
          nullable: true
        work_completed_at:
          type: string
          format: date-time
          nullable: true
        work_completed_by:
          type: string
          nullable: true
          readOnly: true
        completion_remarks:
          type: string
        validated_at:
          type: string
          format: date-time
          nullable: true
        validated_by:
          type: string
          nullable: true
          readOnly: true
        escalation_level:
          allOf:
          - $ref: '#/components/schemas/EscalationLevelEnum'
          minimum: 0
          maximum: 32767
        escalation_level_display:
          type: string
        escalated_at:
          type: string
          format: date-time
          nullable: true
        escalation_reason:
          type: string
        resolution_summary:
          type: string
        resolved_at:
          type: string
          format: date-time
          nullable: true
        endorsements:
          type: array
          items:
            $ref: '#/components/schemas/Endorsement'
          readOnly: true
        routed_at:
          type: string
          format: date-time
          nullable: true
          description: When the current office received it (clock start).
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_by:
          type: string
          nullable: true
          readOnly: true
        acceptance_due_at:
          type: string
          format: date-time
          nullable: true
        screening:
          description: Answers to the office's screening checklist.
        screening_checklist:
          type: array
          items:
            type: string
          readOnly: true
        returned_at:
          type: string
          format: date-time
          nullable: true
        return_reason:
          type: string
        return_count:
          type: integer
          maximum: 32767
          minimum: 0
        priority_level:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
          readOnly: true
        priority_reason:
          type: string
          maxLength: 300
        response_due_at:
          type: string
          format: date-time
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
        responded_by:
          type: string
          nullable: true
          readOnly: true
        response_remarks:
          type: string
        breaches:
          type: array
          items:
            type: string
          readOnly: true
        reports:
          type: array
          items:

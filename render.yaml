# Render Blueprint: New → Blueprint → pick this repo. Values marked sync:false are typed in the dashboard.
services:
  - type: web
    name: ccadss-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: bash build.sh
    # 1 worker × 4 threads fits the free plan's 512 MB (the ML model is loaded once)
    startCommand: gunicorn config.wsgi:application --worker-class gthread --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SITE_MODE
        value: prototype
      - key: DATABASE_URL          # Neon → Connection string (direct, not pooled), ends with ?sslmode=require
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # https://ccadss.pages.dev
        sync: false
      - key: CSRF_TRUSTED_ORIGINS  # https://ccadss.pages.dev
        sync: false
      - key: PUBLIC_SITE_URL       # https://ccadss.pages.dev  (used in SMS/email links)
        sync: false
      - key: MEDIA_S3_BUCKET       # private bucket for photos + models (Backblaze B2 or Cloudflare R2)
        sync: false
      - key: MEDIA_S3_ENDPOINT     # B2: https://s3.us-west-004.backblazeb2.com  ·  R2: https://<account>.r2.cloudflarestorage.com
        sync: false
      - key: MEDIA_S3_REGION       # B2: us-west-004 (from the endpoint)  ·  R2: auto
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: CRON_TOKEN
        generateValue: true
      - key: ADMIN_URL             # e.g. ccadss-admin-7f3k/  (not the default admin/)
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: NOTIFY_EMAIL
        value: "0"
      - key: PUBLIC_SAMPLE_DATA
        value: "True"
      - key: AWS_REQUEST_CHECKSUM_CALCULATION   # newer boto3 + B2/R2 compatibility
        value: when_required
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
